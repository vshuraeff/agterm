name: Intel CI

on:
  push:
    branches: [legacy/intel]
  pull_request:
    branches: [legacy/intel]
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Intel detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.swift == 'true' }}
      cookbook: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.cookbook == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            swift:
              - "**/*.swift"
              - "agtermCore/**"
              - "agterm/**"
              # the agent skill and its plugin manifests: SkillInstallTests reads
              # them, so a skill- or manifest-only change must still run the suite
              - "plugins/**"
              - ".claude-plugin/**"
              - ".agents/**"
              - "project.yml"
              - "scripts/**"
              - ".swiftlint.yml"
              - "agtermTests/.swiftlint.yml"
              - "agtermUITests/.swiftlint.yml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/intel-ci.yml"
              - ".github/workflows/intel-build.yml"
            cookbook:
              - "cookbook/**"
              - ".github/workflows/ci.yml"
              - ".github/workflows/intel-ci.yml"

  test:
    name: Intel unit tests
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify Intel toolchain
        run: |
          test "$(uname -m)" = x86_64
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.3'
      - name: Install fish
        run: brew install fish
      - name: Verify fish
        run: which fish && fish --version
      - name: swift test (with coverage)
        working-directory: agtermCore
        run: ../scripts/watchdog.sh swift test --enable-code-coverage
        env:
          AGTERM_REQUIRE_FISH: "1"
          # the budget includes the cold build, about 10 minutes on the Intel runner
          WATCHDOG_SECONDS: "1200"
          DIAG_DIR: ${{ github.workspace }}/test-hang
      - name: upload hang diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-hang
          path: test-hang
          if-no-files-found: ignore
      - name: export lcov
        working-directory: agtermCore
        # rewrite the absolute SF: paths llvm-cov emits to repo-relative so the
        # separate linux coverage job can resolve them against its own checkout
        run: |
          BIN=$(swift build --show-bin-path)
          xcrun llvm-cov export \
            "$BIN/agtermCorePackageTests.xctest/Contents/MacOS/agtermCorePackageTests" \
            -instr-profile "$BIN/codecov/default.profdata" \
            -format=lcov \
            -ignore-filename-regex='(\.build|Tests|checkouts)/' \
            | sed "s|SF:$GITHUB_WORKSPACE/|SF:|g" > coverage.lcov
      - name: upload lcov artifact
        # coverage is best-effort: a transient artifact-service outage must not
        # red the build when the tests themselves passed
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: agtermCore/coverage.lcov

  coverage:
    name: Intel coverage upload
    needs: [changes, test]
    if: needs.changes.outputs.swift == 'true'
    # the coveralls action installs its reporter via a brew tap on macOS (now blocked
    # by homebrew's tap-trust gate); on linux it downloads a binary, so upload here
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        # the upload side is best-effort; if the artifact never landed, don't fail
        # this job either — the coveralls submit below is already continue-on-error
        continue-on-error: true
        with:
          name: coverage-lcov
      - name: submit coverage to coveralls
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
          format: lcov

  lint:
    name: Intel swiftlint
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify Intel toolchain
        run: |
          test "$(uname -m)" = x86_64
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.3'
      - name: Install swiftlint
        run: brew install swiftlint
      - name: swiftlint (strict)
        run: swiftlint lint --strict

  # libghostty and zmx build once here; build, fixtures and hosted restore them by these keys in parallel
  deps:
    name: Intel build libghostty + zmx
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-15-intel
    # a cold libghostty build takes about 40 minutes on the Intel runner
    timeout-minutes: 90
    outputs:
      ghostty-key: ${{ steps.ghostty-cache.outputs.cache-primary-key }}
      zmx-key: ${{ steps.zmx-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify Intel toolchain
        run: |
          test "$(uname -m)" = x86_64
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.3'
      - name: Read pinned helper revisions
        id: revisions
        shell: bash
        run: |
          ghostty=$(sed -nE 's/^GHOSTTY_REV="([^"]+)".*/\1/p' scripts/setup.sh)
          zmx=$(sed -nE 's/^ZMX_REV="([^"]+)".*/\1/p' scripts/setup.sh)
          zmx_target=$(sed -nE 's/^ZMX_TARGET="([^"]+)".*/\1/p' scripts/setup.sh)
          zig=$(sed -nE 's/^ZIG_FORMULA="([^"]+)".*/\1/p' scripts/setup.sh)
          [ -n "$ghostty" ] && [ -n "$zmx" ] && [ -n "$zmx_target" ] && [ -n "$zig" ]
          brew install "$zig"
          zig_version=$("$(brew --prefix "$zig")/bin/zig" version)
          {
            echo "ghostty=$ghostty"
            echo "zmx=$zmx"
            echo "zmx_target=$zmx_target"
            echo "zig=$zig_version"
            echo "xcode=$(xcodebuild -version | tr '\n' '-')"
            echo "os=$(sw_vers -productVersion)"
          } >> "$GITHUB_OUTPUT"
      # setup.sh rebuilds whatever is missing, so a hit is restored for real rather than looked up
      - name: Cache libghostty (GhosttyKit + resources)
        id: ghostty-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            GhosttyKit.xcframework
            agterm/Resources/ghostty
            agterm/Resources/terminfo
            .ghostty-build-stamp
          key: ghosttykit-v2-${{ runner.os }}-${{ steps.revisions.outputs.os }}-${{ runner.arch }}-${{ steps.revisions.outputs.xcode }}-${{ steps.revisions.outputs.zig }}-${{ steps.revisions.outputs.ghostty }}-${{ hashFiles('scripts/setup.sh', 'scripts/zmx-patches/**/*.patch') }}
      - name: Cache zmx
        id: zmx-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            agterm/Resources/zmx
            .zmx-build-stamp
          key: zmx-v2-${{ runner.os }}-${{ steps.revisions.outputs.os }}-${{ runner.arch }}-${{ steps.revisions.outputs.xcode }}-${{ steps.revisions.outputs.zig }}-${{ steps.revisions.outputs.zmx }}-${{ steps.revisions.outputs.zmx_target }}-${{ hashFiles('scripts/setup.sh', 'scripts/zmx-patches/**/*.patch') }}
      - name: Build libghostty + zmx
        if: steps.ghostty-cache.outputs.cache-hit != 'true' || steps.zmx-cache.outputs.cache-hit != 'true'
        run: ./scripts/setup.sh
      - name: Save libghostty cache
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            GhosttyKit.xcframework
            agterm/Resources/ghostty
            agterm/Resources/terminfo
            .ghostty-build-stamp
          key: ${{ steps.ghostty-cache.outputs.cache-primary-key }}
      - name: Save zmx cache
        if: steps.zmx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            agterm/Resources/zmx
            .zmx-build-stamp
          key: ${{ steps.zmx-cache.outputs.cache-primary-key }}

  build:
    name: Intel build app
    needs: [changes, deps]
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Verify Intel toolchain
        run: |
          test "$(uname -m)" = x86_64
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.3'
      - name: Restore libghostty
        uses: actions/cache/restore@v6
        with:
          path: |
            GhosttyKit.xcframework
            agterm/Resources/ghostty
            agterm/Resources/terminfo
            .ghostty-build-stamp
          key: ${{ needs.deps.outputs.ghostty-key }}
          fail-on-cache-miss: true
      - name: Restore zmx
        uses: actions/cache/restore@v6
        with:
          path: |
            agterm/Resources/zmx
            .zmx-build-stamp
          key: ${{ needs.deps.outputs.zmx-key }}
          fail-on-cache-miss: true
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build app (Release)
        run: scripts/build.sh
      - name: Verify every bundled Mach-O is Intel
        run: bash scripts/intel-verify-arch.sh build/DerivedData/Build/Products/Release/agterm.app
      # Nested helpers are standalone executables. A deep app re-seal with entitlements can stamp the
      # app's TCC grants onto them while leaving the build green (issue #396).
      - name: Verify helper signatures and entitlements
        shell: bash
        run: |
          app=build/DerivedData/Build/Products/Release/agterm.app
          for name in agtermctl zmx agterm-session-host; do
            helper="$app/Contents/MacOS/$name"
            [ -f "$helper" ] || { echo "$name not found at $helper" >&2; exit 1; }
            codesign --verify --strict "$helper"
            if codesign -d --entitlements - "$helper" 2>/dev/null | grep -q 'com.apple.security'; then
              echo "$name carries app entitlements" >&2
              exit 1
            fi
          done
      # the Debug-only hardened-runtime exceptions (allow-jit, allow-unsigned-executable-memory,
      # disable-library-validation) must never reach a shipped build, and the TCC set must not shrink
      # either — losing one silently removes the user's only path to granting that permission (#396).
      # Pin the exact Release set; adding or dropping a key is a deliberate act that edits this list.
      - name: Verify the app's Release entitlements
        shell: bash
        run: |
          app=build/DerivedData/Build/Products/Release/agterm.app
          [ -d "$app" ] || { echo "app not found at $app" >&2; exit 1; }
          # values and their types, not just names. A key set to <false/> is not granted and macOS treats
          # it exactly like a missing one, so a name-only compare would pass that through; and codesign
          # accepts <string>true</string>, which renders as bare true without the tojson below.
          expected=$(printf '%s=true\n' \
            com.apple.security.automation.apple-events \
            com.apple.security.device.audio-input \
            com.apple.security.device.camera \
            com.apple.security.personal-information.addressbook \
            com.apple.security.personal-information.calendars \
            com.apple.security.personal-information.location \
            com.apple.security.personal-information.photos-library)
          # get-task-allow is added by the ad-hoc "Sign to Run Locally" identity this job builds with,
          # and never survives the Developer ID re-sign in scripts/release.sh. Drop it, then match exactly.
          actual=$(codesign -d --entitlements - --xml "$app" 2>/dev/null \
            | plutil -convert json -o - -- - \
            | jq -r 'to_entries[] | select(.key != "com.apple.security.get-task-allow")
                     | "\(.key)=\(.value|tojson)"' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "Release entitlements changed. expected:" >&2; echo "$expected" >&2
            echo "actual:" >&2; echo "$actual" >&2
            exit 1
          fi
      # the split states the shipping set twice, and only the Release copy is pinned above. A TCC key
      # added to the shipping file and missed here leaves Debug unable to prompt for it, with every job
      # green — the failure surfaces only when someone verifies the new permission by hand in a Debug
      # instance. Derive Debug's expected content from the shipping file so the two cannot drift.
      - name: Verify the Debug entitlements are the shipping set plus the exceptions
        shell: bash
        run: |
          keys() { plutil -convert json -o - -- "$1" | jq -r 'to_entries[] | "\(.key)=\(.value|tojson)"' | sort; }
          release=$(keys agterm/agterm.entitlements)
          debug=$(keys agterm/agterm-debug.entitlements)
          exceptions=$(printf '%s=true\n' \
            com.apple.security.cs.allow-jit \
            com.apple.security.cs.allow-unsigned-executable-memory \
            com.apple.security.cs.disable-library-validation | sort)
          expected=$(printf '%s\n%s\n' "$release" "$exceptions" | sort)
          if [ "$debug" != "$expected" ]; then
            echo "agterm-debug.entitlements is not the shipping set plus the three exceptions." >&2
            diff <(echo "$expected") <(echo "$debug") >&2 || true
            exit 1
          fi
      - name: Upload the Release binary for the closure check
        uses: actions/upload-artifact@v4
        with:
          name: closure-release
          path: build/DerivedData/Build/Products/Release/agterm.app/Contents/MacOS/agterm
          if-no-files-found: error

  fixtures:
    name: Intel session host fixtures
    needs: [changes, deps]
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify Intel toolchain
        run: |
          test "$(uname -m)" = x86_64
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.3'
      - name: Restore zmx
        uses: actions/cache/restore@v6
        with:
          path: |
            agterm/Resources/zmx
            .zmx-build-stamp
          key: ${{ needs.deps.outputs.zmx-key }}
          fail-on-cache-miss: true
      # The session-host fixtures attach to a real zmx daemon, so they skip in the Unit tests job,
      # which stages no artifacts. This job has them.
      - name: Session host fixtures against the staged zmx
        working-directory: agtermCore
        run: swift test --filter SessionHostServerTests

  hosted:
    name: Intel application-hosted tests
    needs: [changes, deps]
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Verify Intel toolchain
        run: |
          test "$(uname -m)" = x86_64
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.3'
      - name: Restore libghostty
        uses: actions/cache/restore@v6
        with:
          path: |
            GhosttyKit.xcframework
            agterm/Resources/ghostty
            agterm/Resources/terminfo
            .ghostty-build-stamp
          key: ${{ needs.deps.outputs.ghostty-key }}
          fail-on-cache-miss: true
      - name: Restore zmx
        uses: actions/cache/restore@v6
        with:
          path: |
            agterm/Resources/zmx
            .zmx-build-stamp
          key: ${{ needs.deps.outputs.zmx-key }}
          fail-on-cache-miss: true
      - name: Install xcodegen
        run: brew install xcodegen
      # The zsh plain-login seam needs zsh here; the fish seam switches the runner shell below.
      - name: Give the runner account a zsh login shell
        run: sudo dscl . -create "/Users/$(id -un)" UserShell /bin/zsh
      - name: Install fish
        run: brew install fish
      - name: Verify fish
        run: which fish && fish --version
      # scripts/test-app.sh plus skips: ImageRenderer asserts in Metal at random on this runner's virtual GPU
      # ("Target device architecture is nil"), so its three tests run only in the local Intel gate
      # xcodebuild hands the test host only TEST_RUNNER_-prefixed variables, prefix stripped.
      - name: Application-hosted unit tests
        env:
          TEST_RUNNER_AGTERM_REQUIRE_FISH: "1"
        run: |
          ./scripts/setup.sh
          xcodegen generate
          xcodebuild test \
            -project agterm.xcodeproj \
            -scheme agtermTests \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -skip-testing:agtermTests/AskDialogViewTests/testTerminalPanelFitsShortContentAndCapsLongLabelsInBothAppearances \
            -skip-testing:agtermTests/AskDialogViewTests/testDialogRendersAtWindowPaneAndShortPaneSizes \
            -skip-testing:agtermTests/WindowContentViewTitlebarTests/testRemoteCloudSplitWeightRemainsVisibleAtSidebarSize
      - name: Plain fish login shell seam
        env:
          TEST_RUNNER_AGTERM_REQUIRE_FISH_LOGIN_SHELL: "1"
          TEST_RUNNER_AGTERM_REQUIRE_FISH: "1"
        run: |
          sudo dscl . -create "/Users/$(id -un)" UserShell "$(which fish)"
          xcodebuild test \
            -project agterm.xcodeproj \
            -scheme agtermTests \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -only-testing:agtermTests/SessionHostFishSeamTests/testPlainLoginShellStartsIntegratedFish
      - name: Upload the Debug binary for the closure check
        uses: actions/upload-artifact@v4
        with:
          name: closure-debug
          path: build/DerivedData/Build/Products/Debug/agterm.app/Contents/MacOS/agterm.debug.dylib
          if-no-files-found: error

  closures:
    name: Intel release closure isolation
    needs: [changes, build, hosted]
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: closure-release
          path: products/Release/agterm.app/Contents/MacOS
      - uses: actions/download-artifact@v4
        with:
          name: closure-debug
          path: products/Debug/agterm.app/Contents/MacOS
      - name: Verify Release WMO closure isolation against Debug
        run: bash scripts/intel-verify-closures.sh products

  cookbook:
    name: Intel cookbook checks
    needs: changes
    if: needs.changes.outputs.cookbook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: recipe layout, index and headings
        # bash explicitly: the block below uses process substitution, and pipefail
        # is what makes a failed find in a command substitution red the step
        shell: bash
        run: |
          fail=0

          # directory set vs index set, BOTH directions
          dirs=$(find cookbook -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)
          # links come ONLY from canonical table rows, so a link in prose, an html
          # comment or a fenced example cannot satisfy the check
          links=$(grep -E '^\|' cookbook/README.md 2>/dev/null \
                  | grep -oE '\]\([a-z0-9][a-z0-9-]*/\)' \
                  | sed -e 's/^](//' -e 's|/)$||' | sort -u || true)
          missing=$(comm -23 <(printf '%s\n' "$dirs") <(printf '%s\n' "$links"))
          stale=$(comm -13 <(printf '%s\n' "$dirs") <(printf '%s\n' "$links"))
          for n in $missing; do echo "::error::$n is missing from the index"; fail=1; done
          for n in $stale;   do echo "::error::index row '$n' points at no such directory"; fail=1; done

          for d in cookbook/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            if printf '%s' "$name" | grep -qE '[^a-z0-9-]|--|^-|-$'; then
              echo "::error::$name is not kebab-case"; fail=1
            fi
            if [ ! -f "$d/README.md" ]; then
              echo "::error::$name has no README.md"; fail=1; continue
            fi
            for h in "## What it does" "## Requirements" "## Setup" \
                     "## Usage" "## How it works" "## Limits"; do
              if ! grep -qxF "$h" "$d/README.md"; then
                echo "::error::$name README is missing the '$h' heading"; fail=1
              fi
            done
          done

          # every script carries a shebang
          while IFS= read -r -d '' f; do
            if ! head -c 2 "$f" | grep -q '#!'; then
              echo "::error::$f has no shebang"; fail=1
            fi
          done < <(find cookbook -type f \( -name '*.sh' -o -name '*.zsh' -o -name '*.fish' -o -name '*.py' \) -print0)

          exit $fail
      - name: shellcheck
        # bash explicitly, for pipefail: xargs -0 -r exits 0 on empty input, so
        # without it a failed find would leave the step green having checked nothing
        shell: bash
        run: find cookbook -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
      - name: Install recipe shells
        # neither is on the ubuntu-latest image; fish runs a recipe regression test
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: zsh syntax check
        # shellcheck cannot parse zsh, so a parse is the only gate .zsh recipes get.
        # -n1 because zsh -n reads one script and treats the rest as its arguments;
        # bash explicitly, for pipefail, same reason as the shellcheck step above
        shell: bash
        run: find cookbook -type f -name '*.zsh' -print0 | xargs -0 -r -n1 zsh -n
      - name: fish syntax check
        # nothing lints .fish either, so a parse is the only gate these recipes get.
        # -n1 because fish --no-execute parses its first argument and ignores the rest,
        # so a batched call would leave the step green having checked one file
        shell: bash
        run: find cookbook -type f -name '*.fish' -print0 | xargs -0 -r -n1 fish --no-execute
      - name: Install ruff
        # not on the ubuntu-latest image, unlike shellcheck. pipx, because the runner's
        # python is externally managed and a bare pip install into it fails. Pinned because a
        # new ruff release can add rules that fail recipes nobody touched
        run: pipx install ruff==0.16.10
      - name: ruff
        # the .py counterpart of shellcheck, so a recipe is linted rather than only parsed.
        # EXE001 is ignored because it fails a shebang on a non-executable file, which
        # collides head-on with the shebang the layout step requires of every script, and
        # would move executable-bit policy into CI where this repo deliberately keeps it
        # out. bash explicitly, for pipefail, same reason as the shellcheck step above
        shell: bash
        run: find cookbook -type f -name '*.py' -print0 | xargs -0 -r ruff check --ignore EXE001
      - name: Python recipe tests
        # one process per file keeps recipes independent and gives each test script its own argv.
        # bash explicitly, for pipefail, same reason as the ruff step above.
        shell: bash
        run: find cookbook -type f -name 'test_*.py' -print0 | xargs -0 -r -n1 python3
